<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Primary SEO -->
    <title>Elder Excursions – Small-Group Journeys to England, Wales, Scotland & Ireland</title>
    <meta name="description" content="Elder Excursions offers thoughtfully designed small-group travel to England, Wales, Scotland, and Ireland. Carefully curated itineraries, comfortable pacing, and unforgettable history-themed experiences for curious travelers." />
    <meta name="keywords" content="small group travel, England tours, Wales tours, Scotland tours, Ireland tours, British Isles travel, senior travel, history tours, Elder Excursions" />
    <meta name="author" content="Elder Excursions, LLC" />
    <meta name="robots" content="index, follow" data-rh="true" />
    <!-- No canonical here: each route sets its own via react-helmet-async.
         A hardcoded one would survive into every route's HTML and give pages
         like /trips/england-wales two conflicting canonicals, which Google
         resolves by ignoring both. -->

    <!-- Open Graph (Facebook, LinkedIn, iMessage previews).
         These are the tags social scrapers actually read: they do not run our
         JS, so the react-helmet-async versions never exist for them and this
         block has to stand on its own. data-rh="true" marks the tags each
         route re-declares, so Helmet replaces them for crawlers that do render
         instead of appending a second, conflicting copy. Only add it to a tag
         every route sets — Helmet deletes any data-rh tag a route omits. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elder Excursions" />
    <meta property="og:url" content="https://elderexcursions.com/" data-rh="true" />
    <meta property="og:title" content="Elder Excursions – Small-Group Journeys to England, Wales, Scotland &amp; Ireland" data-rh="true" />
    <meta property="og:description" content="Thoughtfully designed small-group travel to England, Wales, Scotland, and Ireland. Curated itineraries, comfortable pacing, and unforgettable memories for curious travelers." data-rh="true" />
    <meta property="og:image" content="https://elderexcursions.com/og-image.jpg" data-rh="true" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Scenic English countryside — Elder Excursions" data-rh="true" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Elder Excursions – Small-Group Journeys to England, Wales, Scotland &amp; Ireland" data-rh="true" />
    <meta name="twitter:description" content="Thoughtfully designed small-group travel to England, Wales, Scotland, and Ireland. Curated itineraries and unforgettable history-themed experiences." data-rh="true" />
    <meta name="twitter:image" content="https://elderexcursions.com/og-image.jpg" data-rh="true" />
    <meta name="twitter:image:alt" content="Scenic English countryside — Elder Excursions" data-rh="true" />

    <!-- Structured Data: Travel Agency -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Elder Excursions, LLC",
      "alternateName": "Elder Excursions",
      "description": "Thoughtfully designed small-group journeys to England, Wales, Scotland, and Ireland for curious travelers.",
      "url": "https://elderexcursions.com",
      "email": "elderexcursions@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "US"
      },
      "areaServed": ["England", "Wales", "Scotland", "Ireland"],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Annual Signature Journeys",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Trip",
              "name": "Cornwall, England & Wales 2027",
              "description": "15-day small-group journey through Cornwall, England and Wales. July 21 – August 4, 2027.",
              "url": "https://elderexcursions.com/trips/england-wales"
            }
          }
        ]
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Hidden form so Netlify detects it at build time (required for React SPAs) -->
    <form name="contact" data-netlify="true" hidden>
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <select name="journey"></select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
